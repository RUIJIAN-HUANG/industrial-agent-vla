    <text x="1190" y="350" class="label" text-anchor="middle">成品位（初始为空）</text>
    <rect x="1085" y="370" width="210" height="145" rx="15" fill="#fff7ed" stroke="#c2410c" stroke-width="3" stroke-dasharray="10 7"/>
