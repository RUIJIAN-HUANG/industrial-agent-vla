    <text x="60" y="76" class="slot" text-anchor="middle">S12</text><text x="60" y="91" class="slot" text-anchor="middle">P03</text>
    <text x="100" y="76" class="slot" text-anchor="middle">S13</text><text x="100" y="91" class="slot" text-anchor="middle">N01</text>
    <text x="140" y="76" class="slot" text-anchor="middle">S14</text><text x="140" y="91" class="slot" text-anchor="middle">W01</text>
    <text x="20" y="124" class="slot" text-anchor="middle">S21</text><text x="20" y="139" class="slot" text-anchor="middle">P02</text>
    <text x="60" y="124" class="slot" text-anchor="middle">S22</text><text x="60" y="139" class="slot" text-anchor="middle">P04</text>
    <text x="100" y="124" class="slot" text-anchor="middle">S23</text><text x="100" y="139" class="slot" text-anchor="middle">N02</text>
    <text x="140" y="124" class="slot" text-anchor="middle">S24</text><text x="140" y="139" class="slot" text-anchor="middle">W02</text>
    <path d="M58 57 V39 Q80 20 102 39 V57" fill="none" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
    <text x="80" y="172" class="tiny" text-anchor="middle">2×4 格口 + 中央提梁</text>
  </g>

  <!-- Shared handoff pad -->
  <g>
    <rect x="742" y="405" width="156" height="150" rx="18" fill="#bbf7d0" stroke="#15803d" stroke-width="4"/>
    <rect x="761" y="431" width="118" height="93" rx="12" fill="#4ade80" opacity="0.48" stroke="#166534" stroke-width="3"/>
    <text x="820" y="459" class="label" text-anchor="middle">HANDOFF</text>
    <text x="820" y="481" class="label" text-anchor="middle">CENTER</text>
    <text x="820" y="505" class="tiny" text-anchor="middle">固定落箱位</text>
    <text x="820" y="542" class="tiny" text-anchor="middle">(0.00, 0.00)</text>
  </g>

