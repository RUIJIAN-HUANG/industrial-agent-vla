<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
    <marker id="arrowBlue" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrowOrange" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#ea580c"/>
    </marker>
    <marker id="arrowDark" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #172033; }
      .title { font-size: 34px; font-weight: 800; }
      .subtitle { font-size: 18px; fill: #526071; }
      .section { font-size: 20px; font-weight: 800; }
      .label { font-size: 16px; font-weight: 700; }
      .small { font-size: 13px; fill: #435166; }
      .tiny { font-size: 11px; fill: #526071; }
      .slot { font-size: 10px; font-weight: 700; fill: #334155; }
      .mono { font-family: Consolas, "Courier New", monospace; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="80" y="58" class="title">Isaac Sim V2 工业场景｜双臂八零件 + 2×4 单箱 + 中央固定交接位</text>
  <text x="80" y="91" class="subtitle">Arm A / π0.5 装箱并交接 → HANDOFF_VERIFY → Arm B / OpenVLA-OFT 搬运到 FINISHED_01</text>

  <!-- Camera coverage -->
  <path d="M390 130 L115 205 L115 815 L790 815 L790 205 Z" fill="#2563eb" opacity="0.035" stroke="#2563eb" stroke-width="2" stroke-dasharray="9 8"/>
  <path d="M800 130 L690 280 L690 650 L910 650 L910 280 Z" fill="#16a34a" opacity="0.04" stroke="#16a34a" stroke-width="2" stroke-dasharray="9 8"/>
  <path d="M1210 130 L835 205 L835 815 L1485 815 L1485 205 Z" fill="#f59e0b" opacity="0.035" stroke="#f59e0b" stroke-width="2" stroke-dasharray="9 8"/>

  <g transform="translate(339,108)">
    <rect width="112" height="43" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/>
    <circle cx="18" cy="21" r="9" fill="#2563eb"/>
    <text x="35" y="27" class="small">CAM_A_TOP</text>
  </g>
  <g transform="translate(737,108)">
    <rect width="126" height="43" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/>
    <circle cx="18" cy="21" r="9" fill="#16a34a"/>
    <text x="35" y="27" class="small">CAM_HANDOFF</text>
  </g>
  <g transform="translate(1159,108)">
    <rect width="112" height="43" rx="12" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="18" cy="21" r="9" fill="#f59e0b"/>
    <text x="35" y="27" class="small">CAM_B_TOP</text>
  </g>

  <!-- Workbench and ownership regions -->
  <rect x="80" y="175" width="1440" height="685" rx="22" fill="#fff" stroke="#8492a6" stroke-width="3" filter="url(#shadow)"/>
  <rect x="110" y="205" width="665" height="625" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <rect x="825" y="205" width="665" height="625" rx="16" fill="#ffedd5" stroke="#f59e0b" stroke-width="3"/>
  <rect x="730" y="205" width="180" height="625" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3" stroke-dasharray="11 7"/>

  <text x="140" y="245" class="section" fill="#1d4ed8">WS_A｜π0.5 + Arm A（装箱与交接）</text>
  <text x="955" y="245" class="section" fill="#c2410c">WS_B｜OpenVLA-OFT + Arm B（搬运）</text>
  <text x="820" y="243" class="label" text-anchor="middle" fill="#166534">共享交接区</text>
  <text x="820" y="265" class="tiny" text-anchor="middle">单臂互斥进入</text>

  <!-- Zone A: upright shafts -->
  <g transform="translate(145,285)">
    <rect width="175" height="120" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/>
    <text x="14" y="25" class="label">ZONE_A｜2 件</text>
    <circle cx="53" cy="64" r="20" fill="#dc2626" stroke="#7f1d1d" stroke-width="3"/>
    <circle cx="53" cy="64" r="7" fill="#fee2e2"/>
    <circle cx="122" cy="64" r="20" fill="#ea580c" stroke="#9a3412" stroke-width="3"/>
    <circle cx="122" cy="64" r="7" fill="#ffedd5"/>
    <text x="53" y="101" class="tiny" text-anchor="middle">P01 正立</text>
    <text x="122" y="101" class="tiny" text-anchor="middle">P02 正立</text>
  </g>

  <!-- Zone B: inverted shafts -->
  <g transform="translate(340,285)">
    <rect width="175" height="120" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/>
    <text x="14" y="25" class="label">ZONE_B｜2 件</text>
    <circle cx="53" cy="64" r="20" fill="#be123c" stroke="#881337" stroke-width="3"/>
    <path d="M43 54 L63 74 M63 54 L43 74" stroke="#fff" stroke-width="4"/>
    <circle cx="122" cy="64" r="20" fill="#9f1239" stroke="#881337" stroke-width="3"/>
    <path d="M112 54 L132 74 M132 54 L112 74" stroke="#fff" stroke-width="4"/>
    <text x="53" y="101" class="tiny" text-anchor="middle">P03 倒立</text>
    <text x="122" y="101" class="tiny" text-anchor="middle">P04 倒立</text>
  </g>

  <!-- Zone C: nuts -->
  <g transform="translate(145,430)">
    <rect width="175" height="120" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/>
    <text x="14" y="25" class="label">ZONE_C｜2 件</text>
    <polygon points="53,42 72,53 72,75 53,86 34,75 34,53" fill="#2563eb" stroke="#1e3a8a" stroke-width="3"/>
    <circle cx="53" cy="64" r="8" fill="#ecfeff" stroke="#1e3a8a" stroke-width="2"/>
    <polygon points="122,42 141,53 141,75 122,86 103,75 103,53" fill="#0284c7" stroke="#075985" stroke-width="3"/>
    <circle cx="122" cy="64" r="8" fill="#ecfeff" stroke="#075985" stroke-width="2"/>
    <text x="53" y="101" class="tiny" text-anchor="middle">N01 平放</text>
    <text x="122" y="101" class="tiny" text-anchor="middle">N02 yaw 30°</text>
  </g>

  <!-- Zone D: wrenches -->
  <g transform="translate(340,430)">
    <rect width="175" height="120" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
    <text x="14" y="25" class="label">ZONE_D｜2 件</text>
    <g transform="translate(53,64) rotate(90)">
      <path d="M-20 0 H14" stroke="#b45309" stroke-width="9" stroke-linecap="round"/>
      <path d="M14 0 L24 -10 M14 0 L24 10" stroke="#b45309" stroke-width="7" stroke-linecap="round"/>
      <circle cx="-21" cy="0" r="8" fill="none" stroke="#b45309" stroke-width="5"/>
    </g>
    <g transform="translate(122,64) rotate(90)">
