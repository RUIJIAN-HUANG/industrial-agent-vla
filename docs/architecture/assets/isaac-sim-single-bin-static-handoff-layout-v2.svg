<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <marker id="arrowBlue" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#ea580c"/>
    </marker>
    <marker id="arrowDark" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #172033; }
      .title { font-size: 34px; font-weight: 800; }
      .subtitle { font-size: 18px; fill: #526071; }
      .section { font-size: 21px; font-weight: 800; }
      .label { font-size: 17px; font-weight: 700; }
      .small { font-size: 14px; fill: #435166; }
      .tiny { font-size: 12px; fill: #526071; }
      .mono { font-family: Consolas, "Courier New", monospace; }
    </style>
  </defs>

  <rect width="1600" height="950" fill="url(#bg)"/>
  <text x="80" y="60" class="title">Isaac Sim 工业场景复现图｜单箱四零件 + 中央固定交接位</text>
  <text x="80" y="94" class="subtitle">Arm A 装箱并放到 HANDOFF_CENTER → A 回 HOME → Supervisor 切换令牌 → Arm B 进入中央抓箱</text>

  <!-- Camera coverage -->
  <path d="M400 140 L165 215 L165 700 L720 700 L720 215 Z" fill="#2563eb" opacity="0.04" stroke="#2563eb" stroke-width="2" stroke-dasharray="9 8"/>
  <path d="M800 140 L675 275 L675 610 L925 610 L925 275 Z" fill="#16a34a" opacity="0.04" stroke="#16a34a" stroke-width="2" stroke-dasharray="9 8"/>
  <path d="M1200 140 L880 215 L880 700 L1435 700 L1435 215 Z" fill="#f59e0b" opacity="0.04" stroke="#f59e0b" stroke-width="2" stroke-dasharray="9 8"/>

  <g transform="translate(353,112)">
    <rect width="94" height="43" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/>
    <circle cx="18" cy="21" r="9" fill="#2563eb"/>
    <text x="35" y="27" class="small">CAM_A_TOP</text>
  </g>
  <g transform="translate(744,112)">
    <rect width="112" height="43" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/>
    <circle cx="18" cy="21" r="9" fill="#16a34a"/>
    <text x="35" y="27" class="small">CAM_HANDOFF</text>
  </g>
  <g transform="translate(1153,112)">
    <rect width="94" height="43" rx="12" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="18" cy="21" r="9" fill="#f59e0b"/>
    <text x="35" y="27" class="small">CAM_B_TOP</text>
  </g>

  <!-- Workbench -->
  <rect x="120" y="185" width="1360" height="590" rx="20" fill="#fff" stroke="#8492a6" stroke-width="3" filter="url(#shadow)"/>
  <rect x="150" y="215" width="590" height="530" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <rect x="860" y="215" width="590" height="530" rx="16" fill="#ffedd5" stroke="#f59e0b" stroke-width="3"/>
  <rect x="700" y="215" width="200" height="530" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3" stroke-dasharray="11 7"/>

  <text x="180" y="253" class="section" fill="#1d4ed8">WS_A｜π0.5 + Arm A（装箱）</text>
  <text x="930" y="253" class="section" fill="#c2410c">WS_B｜OpenVLA + Arm B（搬运）</text>
  <text x="800" y="250" class="label" text-anchor="middle" fill="#166534">共享交接区</text>
  <text x="800" y="274" class="tiny" text-anchor="middle">同一时刻只允许一台机械臂进入</text>

  <!-- Four part ROIs -->
  <g>
    <rect x="205" y="300" width="182" height="126" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/>
    <text x="222" y="326" class="label">ZONE_A｜2 件</text>
    <text x="296" y="348" class="tiny" text-anchor="middle">唯一最多区域</text>
    <circle cx="266" cy="375" r="22" fill="#dc2626" stroke="#7f1d1d" stroke-width="3"/>
    <circle cx="266" cy="375" r="6" fill="#fee2e2"/>
    <text x="266" y="411" class="tiny" text-anchor="middle">P01 正常</text>
    <circle cx="332" cy="375" r="22" fill="#fff" stroke="#dc2626" stroke-width="6"/>
    <path d="M320 363 L344 387 M344 363 L320 387" stroke="#dc2626" stroke-width="4"/>
    <text x="332" y="411" class="tiny" text-anchor="middle">P02 倒放</text>

    <rect x="414" y="300" width="150" height="126" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/>
    <text x="430" y="326" class="label">ZONE_B｜1 件</text>
    <circle cx="489" cy="375" r="22" fill="#dc2626" stroke="#7f1d1d" stroke-width="3"/>
    <circle cx="489" cy="375" r="6" fill="#fee2e2"/>
    <text x="489" y="411" class="tiny" text-anchor="middle">P03 正常</text>

    <rect x="205" y="444" width="182" height="126" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/>
    <text x="222" y="470" class="label">ZONE_C｜1 件</text>
    <circle cx="296" cy="515" r="22" fill="#dc2626" stroke="#7f1d1d" stroke-width="3"/>
    <circle cx="296" cy="515" r="6" fill="#fee2e2"/>
    <text x="296" y="551" class="tiny" text-anchor="middle">P04 正常</text>

    <rect x="414" y="444" width="150" height="126" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/>
    <text x="430" y="470" class="label">ZONE_D｜0 件</text>
    <text x="489" y="522" class="small" text-anchor="middle">空区域负样本</text>
  </g>

  <!-- Single bin -->
  <g transform="translate(370,610)">
    <text x="92" y="-17" class="label" text-anchor="middle">唯一空料箱｜BIN_01</text>
    <rect width="184" height="108" rx="12" fill="#e5e7eb" stroke="#475569" stroke-width="3"/>
    <path d="M61 9V82 M122 9V82 M9 46H175" stroke="#94a3b8" stroke-width="2"/>
    <path d="M66 92 Q92 114 118 92" fill="none" stroke="#334155" stroke-width="7"/>
    <text x="92" y="68" class="small" text-anchor="middle">2×3 格口</text>
  </g>

  <!-- Static shared handoff pad -->
  <g>
    <rect x="712" y="438" width="176" height="142" rx="18" fill="#bbf7d0" stroke="#15803d" stroke-width="4"/>
    <rect x="736" y="463" width="128" height="92" rx="12" fill="#4ade80" opacity="0.55" stroke="#166534" stroke-width="3"/>
    <text x="800" y="492" class="label" text-anchor="middle">HANDOFF_CENTER</text>
    <text x="800" y="518" class="small" text-anchor="middle">固定落箱位</text>
    <text x="800" y="541" class="tiny" text-anchor="middle">无传送带／无运动机构</text>
  </g>

  <!-- One output -->
  <g>
    <text x="1070" y="346" class="label">唯一成品位（初始为空）</text>
    <rect x="1080" y="373" width="185" height="138" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="3" stroke-dasharray="10 7"/>
    <text x="1172" y="447" class="label" text-anchor="middle">FINISHED_01</text>
    <text x="1172" y="472" class="tiny" text-anchor="middle">B 臂最终放置</text>
  </g>

  <!-- Robots -->
  <g>
    <circle cx="545" cy="720" r="57" fill="#cbd5e1" stroke="#1e3a8a" stroke-width="5"/>
    <circle cx="545" cy="720" r="21" fill="#64748b"/>
    <path d="M545 661 Q615 615 702 557" fill="none" stroke="#334155" stroke-width="18" stroke-linecap="round"/>
    <circle cx="702" cy="557" r="16" fill="#475569"/>
    <text x="545" y="805" class="label" text-anchor="middle">ARM_A_BASE</text>

    <circle cx="1055" cy="720" r="57" fill="#cbd5e1" stroke="#9a3412" stroke-width="5"/>
    <circle cx="1055" cy="720" r="21" fill="#64748b"/>
    <path d="M1055 661 Q985 615 898 557" fill="none" stroke="#334155" stroke-width="18" stroke-linecap="round"/>
    <circle cx="898" cy="557" r="16" fill="#475569"/>
    <text x="1055" y="805" class="label" text-anchor="middle">ARM_B_BASE</text>
  </g>

  <!-- Token sequence -->
  <g>
    <path d="M650 392 C706 360 744 360 770 420" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <circle cx="657" cy="370" r="18" fill="#2563eb"/>
    <text x="657" y="376" class="label" text-anchor="middle" fill="#fff">1</text>
    <text x="620" y="341" class="small">A 放箱</text>

    <rect x="706" y="611" width="188" height="52" rx="14" fill="#fff" stroke="#ef4444" stroke-width="2"/>
    <text x="800" y="632" class="small" text-anchor="middle">2｜A_HOME + HANDOFF_VERIFY</text>
    <text x="800" y="653" class="tiny" text-anchor="middle">A_ONLY → HANDOFF_VERIFY → B_ONLY</text>

    <path d="M950 392 C894 360 856 360 830 420" fill="none" stroke="#ea580c" stroke-width="4" marker-end="url(#arrowOrange)"/>
    <circle cx="943" cy="370" r="18" fill="#ea580c"/>
    <text x="943" y="376" class="label" text-anchor="middle" fill="#fff">3</text>
    <text x="948" y="341" class="small">B 抓箱</text>
  </g>

  <!-- Axes and dimensions -->
  <g>
    <circle cx="800" cy="745" r="7" fill="#111827"/>
    <path d="M800 745 H905" stroke="#334155" stroke-width="3" marker-end="url(#arrowDark)"/>
    <path d="M800 745 V680" stroke="#334155" stroke-width="3" marker-end="url(#arrowDark)"/>
    <text x="914" y="751" class="small">+X：A → B</text>
    <text x="810" y="681" class="tiny">+Y</text>
    <text x="808" y="766" class="tiny mono">world (0,0), table Z=0.75 m</text>

    <path d="M150 840 H1450" stroke="#64748b" stroke-width="2"/>
    <path d="M150 830 V850 M1450 830 V850" stroke="#64748b" stroke-width="2"/>
    <text x="800" y="872" class="small" text-anchor="middle">工作台建议尺寸：2.30 m × 1.10 m｜中央交接垫建议：0.26 m × 0.20 m</text>
  </g>

  <!-- Frozen recipe -->
  <g transform="translate(80,892)">
    <rect width="1440" height="42" rx="13" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="25" y="27" class="label">冻结配方：</text>
    <text x="142" y="27" class="small mono">BIN_01=[P01,P02,P03,P04] · READY=4/4（2×3 箱保留 2 个空格）· 一个箱只交接一次</text>
  </g>
</svg>
