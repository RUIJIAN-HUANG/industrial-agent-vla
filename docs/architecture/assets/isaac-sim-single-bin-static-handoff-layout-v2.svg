      <path d="M14 0 L24 -10 M14 0 L24 10" stroke="#ca8a04" stroke-width="7" stroke-linecap="round"/>
      <circle cx="-21" cy="0" r="8" fill="none" stroke="#ca8a04" stroke-width="5"/>
