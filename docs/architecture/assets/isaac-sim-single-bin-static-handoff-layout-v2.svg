    <text x="1190" y="457" class="small" text-anchor="middle">Bin_01 最终放置</text>
    <text x="1190" y="482" class="tiny" text-anchor="middle">(0.70, 0.10)</text>
  </g>

  <!-- Robots -->
  <g>
    <circle cx="505" cy="710" r="58" fill="#cbd5e1" stroke="#1e3a8a" stroke-width="5"/>
    <circle cx="505" cy="710" r="21" fill="#64748b"/>
    <path d="M505 650 Q585 585 744 520" fill="none" stroke="#334155" stroke-width="18" stroke-linecap="round"/>
    <circle cx="744" cy="520" r="16" fill="#475569"/>
    <text x="505" y="794" class="label" text-anchor="middle">Arm_A BASE</text>
    <text x="505" y="816" class="tiny" text-anchor="middle">(-0.55, -0.30) · π0.5</text>

    <circle cx="1095" cy="710" r="58" fill="#cbd5e1" stroke="#9a3412" stroke-width="5"/>
    <circle cx="1095" cy="710" r="21" fill="#64748b"/>
    <path d="M1095 650 Q1015 585 896 520" fill="none" stroke="#334155" stroke-width="18" stroke-linecap="round"/>
    <circle cx="896" cy="520" r="16" fill="#475569"/>
    <text x="1095" y="794" class="label" text-anchor="middle">Arm_B BASE</text>
    <text x="1095" y="816" class="tiny" text-anchor="middle">(0.50, -0.30) · OpenVLA-OFT</text>
  </g>

  <!-- Workflow arrows -->
  <g>
    <path d="M485 585 C545 565 575 540 605 500" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <circle cx="505" cy="568" r="17" fill="#2563eb"/>
    <text x="505" y="574" class="label" text-anchor="middle" fill="#fff">1</text>
    <text x="535" y="590" class="small">A 装箱</text>

    <path d="M690 410 C718 400 730 420 752 446" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#arrowGreen)"/>
    <circle cx="716" cy="390" r="17" fill="#16a34a"/>
    <text x="716" y="396" class="label" text-anchor="middle" fill="#fff">2</text>
    <text x="680" y="365" class="small">A 放箱</text>

    <path d="M905 445 C975 375 1030 370 1084 411" fill="none" stroke="#ea580c" stroke-width="4" marker-end="url(#arrowOrange)"/>
    <circle cx="966" cy="385" r="17" fill="#ea580c"/>
    <text x="966" y="391" class="label" text-anchor="middle" fill="#fff">3</text>
    <text x="940" y="350" class="small">B 搬箱</text>
  </g>

  <!-- Axes and dimensions -->
  <g>
    <circle cx="820" cy="820" r="7" fill="#111827"/>
    <path d="M820 820 H925" stroke="#334155" stroke-width="3" marker-end="url(#arrowDark)"/>
    <path d="M820 820 V755" stroke="#334155" stroke-width="3" marker-end="url(#arrowDark)"/>
    <text x="934" y="826" class="small">+X：A → B</text>
    <text x="830" y="757" class="small">+Y</text>
    <text x="828" y="846" class="tiny mono">world (0,0), table surface Z=0.75 m</text>

    <path d="M110 880 H1490" stroke="#64748b" stroke-width="2"/>
    <path d="M110 870 V890 M1490 870 V890" stroke="#64748b" stroke-width="2"/>
    <text x="800" y="906" class="small" text-anchor="middle">工作台 2.30 m × 1.10 m｜Bin_01 0.30 m × 0.22 m × 0.09 m｜初始 PACK_STATION=(-0.35, 0.20)</text>
  </g>

  <!-- Frozen recipe -->
  <g transform="translate(80,928)">
    <rect width="1440" height="52" rx="13" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="22" y="22" class="label">冻结配方：</text>
    <text x="125" y="22" class="small mono">S11=P01 · S12=P03 · S13=N01 · S14=W01</text>
    <text x="125" y="42" class="small mono">S21=P02 · S22=P04 · S23=N02 · S24=W02 · READY=8/8 · 单箱交接一次</text>
  </g>
</svg>
