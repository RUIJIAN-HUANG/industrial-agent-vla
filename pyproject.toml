[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-agent-vla"
version = "0.1.0"
description = "Lightweight industrial supervisor agent with dual-VLA executors"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "Pillow>=10,<13",
]

[project.optional-dependencies]
test = [
    "jsonschema>=4.23,<5",
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests", "services/openvla_oft/tests"]
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers"
