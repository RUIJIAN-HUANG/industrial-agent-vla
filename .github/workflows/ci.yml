name: Python quality and tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.11"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install project and pinned CI tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-ci.txt

      - name: Verify the two official sources
        run: python scripts/verify_official_baselines.py

      - name: Verify project-frozen snapshots
        run: python scripts/verify_project_frozen_inputs.py

      - name: Check Python formatting
        run: python -m ruff format --check .

      - name: Lint Python
        run: python -m ruff check .

      - name: Run unit and contract tests
        run: python -m pytest -q

      - name: Check repository file policy
        run: python scripts/check_repository_hygiene.py

      - name: Check whitespace
        run: git diff --check
