[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openvla-oft"
version = "0.1.0"
description = "Standalone OpenVLA-OFT executor service for Arm_B."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = [
    "jsonschema>=4.23,<5",
    "pytest>=8,<9",
    "ruff>=0.6,<1"
]
model = [
    "torch>=2",
    "transformers>=4"
]

[project.scripts]
openvla-oft-server = "openvla_oft.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
